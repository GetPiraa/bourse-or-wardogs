name: Mise à jour du prix de l'or

on:
  schedule:
    # L'heure à laquelle le studio fixe le prix du jour n'est pas connue (entre 00h37 et 09h25 UTC le 12 octobre 2026).
    # La source relit le jeu une fois par heure, à la minute 25 (vérifié le 12 octobre à 09h25 et 10h25 UTC), et garde
    # son relevé 5 minutes en cache : deux passages par heure, à la minute 27 et à la minute 32, jour et nuit.
    - cron: '27,32 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'build.js', 'model.js', 'config.json', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données et reconstruire la page
        run: node build.js
      - name: Publier s'il y a du nouveau
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: mise à jour automatique du prix"
            git pull --rebase --autostash
            git push
          fi
