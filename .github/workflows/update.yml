name: Mise à jour du prix de l'or

on:
  schedule:
    # MetaForge enregistre le nouveau prix vers la minute 25 de chaque heure (09h25 UTC le 12 octobre 2026) et son relevé
    # reste en cache 5 minutes. Le matin, de 5h à 13h UTC, un passage toutes les 5 minutes le publie dès qu'il y est.
    # Le reste de la journée, un passage par heure juste après la minute 25 rattrape une correction.
    - cron: '*/5 5-12 * * *'
    - cron: '29 0-4,13-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'build.js', 'model.js', 'config.json', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les données et reconstruire la page
        run: node build.js
      - name: Publier s'il y a du nouveau
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "data: mise à jour automatique du prix"
            git pull --rebase --autostash
            git push
          fi
